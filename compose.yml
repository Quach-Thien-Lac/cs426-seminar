name: sanguosuo
services:
  server:
    container_name: sanguosuo-server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    env_file:
      - .env
    volumes:
      - ./server:/app
      - node_modules:/app/node_modules
    restart: unless-stopped

  db:
    container_name: sanguosuo-db
    image: mysql:oraclelinux9
    ports:
      - '3306:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=${LOCAL_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  node_modules: